name: Routine Cache Synchronization

on:
  schedule:
    - cron: '11,41 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [routine-sync, event-dispatch]

concurrency:
  group: routine-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Synchronize working branch
        run: |
          git pull --rebase origin main || true

      - name: Execute scheduled sync cycle
        env:
          APP_SOURCES_DATA: ${{ secrets.APP_SOURCES_DATA }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.NOTIFY_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.NOTIFY_TARGET || secrets.TELEGRAM_CHAT_ID }}
          FB_COOKIES: ${{ secrets.AUTH_TOKEN || secrets.FB_COOKIES }}
          AUTO_BASELINE_FIRST_RUN: 'true'
          REQUEST_DELAY_SECONDS: '2'
        run: |
          python3 main.py --once

      - name: Update state cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.json
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "chore(cache): update index state [skip ci]"
            git pull --rebase -X ours origin main || git pull --rebase origin main || true
            git push
          fi

      - name: Maintain workflow retention
        if: always()
        run: |
          gh workflow enable ci.yml || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
