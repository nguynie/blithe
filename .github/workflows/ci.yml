name: Routine Cache Synchronization

on:
  schedule:
    - cron: '11,41 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [routine-sync, event-dispatch]

concurrency:
  group: routine-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Restore state cache
        uses: actions/cache/restore@v4
        with:
          path: index.json
          key: state-cache-${{ github.run_id }}
          restore-keys: |
            state-cache-

      - name: Initialize state if cache miss
        run: |
          if [ ! -f index.json ]; then
            git show HEAD~1:index.json > index.json 2>/dev/null || echo "{}" > index.json
          fi

      - name: Execute scheduled sync cycle
        env:
          APP_SOURCES_DATA: ${{ secrets.APP_SOURCES_DATA }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.NOTIFY_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.NOTIFY_TARGET || secrets.TELEGRAM_CHAT_ID }}
          FB_COOKIES: ${{ secrets.AUTH_TOKEN || secrets.FB_COOKIES }}
          AUTO_BASELINE_FIRST_RUN: 'true'
          REQUEST_DELAY_SECONDS: '2'
        run: |
          python3 main.py --once

      - name: Persist state cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: index.json
          key: state-cache-${{ github.run_id }}

      - name: Maintain workflow retention
        if: always()
        run: |
          gh workflow enable ci.yml || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
