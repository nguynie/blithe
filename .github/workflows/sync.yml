name: Routine Cache Synchronizer

on:
  schedule:
    # Offset minutes avoid peak top-of-hour congestion on GitHub runners
    - cron: '11,41 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI
  repository_dispatch: # Allows instant webhook triggers from external schedulers
    types: [check-pages-webhook, sync-event]

concurrency:
  group: routine-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to commit and push updated cache
      actions: write  # Required for keepalive to prevent auto-disable

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Pull latest state
        run: |
          git pull --rebase origin main || true

      - name: Execute synchronization task
        env:
          APP_SOURCES_DATA: ${{ secrets.APP_SOURCES_DATA }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FB_COOKIES: ${{ secrets.FB_COOKIES }}
          AUTO_BASELINE_FIRST_RUN: 'true'
          REQUEST_DELAY_SECONDS: '2'
        run: |
          python3 main.py --once

      - name: Save state cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_posts.json
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "chore: sync cache [skip ci]"
            git pull --rebase -X ours origin main || git pull --rebase origin main || true
            git push
          fi

      - name: Keepalive Workflow
        if: always()
        run: |
          gh workflow enable sync.yml || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
